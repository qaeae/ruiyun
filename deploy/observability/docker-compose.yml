# ==========================================================================================
# 可观测性基础设施（P4）：Prometheus + Grafana + SkyWalking（OAP/UI）
#
# 用法（在 wms-platform 目录下）：
#   docker compose -f deploy/observability/docker-compose.yml up -d
#   # Prometheus  http://localhost:9090
#   # Grafana     http://localhost:3001  (admin/admin)
#   # SkyWalking  http://localhost:8080  ← 与 wms-core 冲突，故 UI 映射到 18082
#
# 说明：
#   - Prometheus 抓取各服务的 /actuator/prometheus（配置见同目录 prometheus.yml）
#   - Grafana 预置 Prometheus 数据源；WMS 看板需按指标名自建（指标清单见 README §49）
#   - SkyWalking OAP 用于 APM（链路追踪/拓扑）：Java 服务通过 **agent 挂载**接入，
#     agent 是无侵入的（-javaagent），因此不改变任何业务代码：
#       java -javaagent:/path/skywalking-agent/skywalking-agent.jar \
#            -Dskywalking.agent.service_name=wms-core \
#            -Dskywalking.collector.backend_service=127.0.0.1:11800 \
#            -jar wms-core/target/wms-core-*-boot.jar
#     agent 与 OAP 必须**版本一致**（此处 9.7.0），否则 gRPC 协议不匹配。
#   - 存储用内置 H2（仅演示/单机）；生产换 Elasticsearch 并调大 JVM。
# ==========================================================================================
services:
  prometheus:
    image: m.daocloud.io/docker.io/prom/prometheus:v2.53.0
    container_name: wms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: m.daocloud.io/docker.io/grafana/grafana:11.1.0
    container_name: wms-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------
  # SkyWalking Java Agent（2026-10-17 加）：把官方 agent 镜像里的 /skywalking/agent 摊平到具名卷，
  # 供各业务服务只读挂载（-javaagent:/skywalking/agent/skywalking-agent.jar）。
  #
  # 为什么绕这一步：agent 以 tar.gz 分发，OAP/UI 镜像里都不带，而**无法直接挂载镜像内路径**，
  # 必须先落成卷或宿主目录。用具名卷的好处是全程自动、跨机器可复现（不用手工下载解压到某路径）。
  # 版本必须与 OAP 一致（同为 9.7.0），否则 gRPC 协议不匹配，agent 连不上且只在日志里报一行错。
  #
  # 关键细节（都是踩出来的）：
  #   1. `optional-plugins` 默认**不生效**：Spring Cloud Gateway 的插件放在这里，必须拷进 plugins/ 才会 instrumentation，
  #      否则网关的入站请求完全没有 trace（其它服务有、唯独网关没有，很容易误判成网关没接入）。
  #   2. 业务容器以 `:ro` 挂这个卷（agent 不应改动），因此 agent 自己写不了 logs/ 目录 ——
  #      各服务需用 SW_LOGGING_DIR 指到可写路径，否则会持续刷 FileNotFoundException。
  # ------------------------------------------------------------------------------------------
  skywalking-agent:
    image: apache/skywalking-java-agent:9.7.0-java17
    container_name: wms-skywalking-agent
    volumes:
      - wms-skywalking-agent:/agent
    # 一次性任务：拷完即退出（restart: no，别让它反复重启刷日志）
    entrypoint:
      - sh
      - -c
      - |
        set -e
        cp -a /skywalking/agent/. /agent/
        cp -a /agent/optional-plugins/apm-spring-cloud-gateway-3.x-plugin-*.jar /agent/plugins/
        cp -a /agent/optional-plugins/apm-spring-cloud-gateway-4.x-plugin-*.jar /agent/plugins/
        echo "[agent] copied to volume wms-skywalking-agent, gateway plugins enabled"
    restart: "no"

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: wms-skywalking-oap
    ports:
      # 11800 = gRPC（agent 上报）；12800 = HTTP（UI 查询）
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      TZ: Asia/Shanghai
    # 健康检查：单体联调最容易卡在"OAP 还没起来就去查"，有它才能被 depends_on 等到。
    # 为什么不探 /healthcheck：**9.7.0 里这个 HTTP 路径不存在**（返回 404），实测会把一个已就绪的
    # OAP 长期标成 unhealthy，并让 UI 因 depends_on 卡死不启动——又一个"假不健康"。
    # 改用 GraphQL 的 version 查询：一次调用同时证明 HTTP 服务、GraphQL 与存储都可用。
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -X POST -H "Content-Type: application/json" -d ''{"query":"query{version}"}'' http://127.0.0.1:12800/graphql | grep -q version'
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: wms-skywalking-ui
    ports:
      # 18082 而不是 8080：8080 已被 wms-core 占用（k8s 里同样别用 8080）
      - "18082:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    depends_on:
      skywalking-oap:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # 具名卷：其它 compose 文件用 external 引用（见 README §58）
  wms-skywalking-agent:
    name: wms-skywalking-agent
