# ==========================================================================================
# 多服务 CI/CD（P5）
#
# 与 ci.yml 的分工：
#   ci.yml     —— 单仓构建 + 架构守卫 + 集成测试（日常门禁）
#   ci-ms.yml  —— **按服务矩阵**构建镜像并与 K8s 清单对齐（发布/部署链路）
#
# 为什么用矩阵而不是一个大 job：
#   微服务化后每个服务的构建/镜像互不影响，矩阵能并行、失败能定位到具体服务，
#   且新增服务只需往 matrix 里加一行（清单与镜像 tag 保持一一对应）。
# ==========================================================================================
name: CI-Microservices

on:
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------------------
  # 1) 全量质量门禁（与 ci.yml 一致，作为发布前置）
  # ---------------------------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 架构守卫 + 单元测试（跳过 IT：IT 需要 Docker/外部依赖，见 integration job）
        run: mvn -B clean verify -Dit.skip=true

  # ---------------------------------------------------------------------------------------
  # 2) 集成测试（Testcontainers，真实 MySQL）
  # ---------------------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 集成测试（用容器起 MySQL；S3 用例在无存储时自动跳过）
        run: mvn -B verify -Dit.skip=false

  # ---------------------------------------------------------------------------------------
  # 3) 按服务构建镜像（矩阵：新增服务只需加一行）
  # ---------------------------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        service: [ wms-core, wms-auth, wms-masterdata, wms-gateway ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 打包（只打该服务及其依赖模块）
        run: mvn -B -pl ${{ matrix.service }} -am package -DskipTests
      - name: 构建并推送镜像
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          # 用 services 目录下的 Dockerfile（约定：deploy/docker/Dockerfile.<service>）
          docker build -f deploy/docker/Dockerfile.${{ matrix.service }} -t "$IMAGE" .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE"
      - name: 输出镜像坐标（供 deploy job / GitOps 仓库取用）
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # 4) 清单校验（确保 YAML 合法；真正的部署由 GitOps/ArgoCD 或 kubectl 执行）
  # ---------------------------------------------------------------------------------------
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 kubeconform（K8s 清单结构校验）
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: 校验 deploy/k8s 下的清单
        run: kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/*.yaml
